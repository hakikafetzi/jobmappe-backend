# --- Application ---
spring.application.name=jobmappe

# --- Database ---
# Connection values come from environment variables (see .env.example).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobmappe}
spring.datasource.username=${DB_USER:jobmappe}
spring.datasource.password=${DB_PASSWORD:jobmappe}

# --- JPA / Hibernate ---
# The schema is managed by Flyway; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Keep database access inside the service layer, no lazy loading during view rendering.
spring.jpa.open-in-view=false

# --- Flyway ---
# Applies the migrations in db/migration on startup.
spring.flyway.enabled=true

# --- Web / Pagination ---
spring.data.web.pageable.default-page-size=15
spring.data.web.pageable.max-page-size=100

# --- Logging ---
logging.level.dev.kafetzi.jobmappe=INFO

# --- Actuator ---
# Expose only the health status (used by the Docker healthcheck), without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Server ---
# Runs behind a reverse proxy (nginx): build absolute URLs (Location headers, Swagger UI server URL)
# from the X-Forwarded-* headers instead of the internal container address.
server.forward-headers-strategy=framework