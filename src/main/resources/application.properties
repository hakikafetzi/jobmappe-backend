spring.application.name=jobmappe

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:jobmappe}
spring.datasource.username=${DB_USER:jobmappe}
spring.datasource.password=${DB_PASSWORD:jobmappe}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.flyway.enabled=true
