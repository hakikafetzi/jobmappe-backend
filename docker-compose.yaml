services:
  db:
    image: postgres:16
    container_name: jobmappe-db
    environment:
      POSTGRES_DB: ${DB_NAME:-jobmappe}
      POSTGRES_USER: ${DB_USER:-jobmappe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobmappe}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobmappe} -d ${DB_NAME:-jobmappe}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
